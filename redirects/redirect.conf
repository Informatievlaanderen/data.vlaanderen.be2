#
# Redirects configuration for data.vlaanderen.be
#
# This file is periodically monitored by nginxReloader.sh.
# When changes are detected, NGINX automatically reloads with zero downtime.
#
# How to add a redirect:
#   1. Add a new location block below
#   2. Commit and push the change to GitHub
#   3. The reloader fetches the file from GitHub every 5 minutes and
#      reloads NGINX automatically when a change is detected.
#
# ── NGINX location matching priority ──────────────────────────────────
#   Priority  Type              Example
#   1 (highest) location = /exact        Exact match
#   2          location ^~ /prefix       Prefix match, stops regex search
#   3          location ~ regex          Regex match, first match wins,
#                                        in order of appearance
#   4 (lowest)  location /prefix         Regular prefix match,
#                                        longest match wins
#
#   Note: Regex locations (~) in this file are evaluated AFTER those in
#   location-enabled/*.proxy files. Use ^~ or = if you need a redirect
#   in this file to take priority over any regex in a .proxy file.
# ───────────────────────────────────────────────────────────────────────
#
# Examples:
#
# Simple redirect (exact path match):
#   location = /oud-pad {
#       return 301 https://data.vlaanderen.be/nieuw-pad;
#   }
#
# Prefix redirect (all paths under /oud/):
#   location ^~ /oud/ {
#       return 301 https://data.vlaanderen.be/nieuw/;
#   }
#
# Regex redirect (with capture groups):
#   location ~ ^/oud-domein/(.*)$ {
#       return 301 https://nieuw-domein.be/$1;
#   }
#
# Proxy pass instead of redirect:
#   location /api/ {
#       proxy_pass http://backend-service;
#   }
#


location ~ /id/concept/(Deeltrajecttype|FinaliteitType|OrganisatieType|Participatietype|PubliekeDienstverleningType|Trajectstatustype|Voorkeurtype)/([^/]+)/?$ {
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept';

    set $name $1;
    set $concept_name $2;
    set $extension "";

    if ( $rdffileextension != "" ) {
        set $extension $rdffileextension;
    }

    if ($extension = "jsonld") {
        return 302 https://raw.githubusercontent.com/Informatievlaanderen/OSLOthema-KVS/refs/heads/main/resources/codelijsten/$name/$concept_name.jsonld;
    }

    return 303 $redirect_scheme://$host/doc/concept/$name/$concept_name;
}
