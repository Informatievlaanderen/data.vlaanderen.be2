name: Publication Validator

on:
  schedule:
    # Run at 1:00 PM UTC every Tuesday
    - cron: "0 13 * * 2"
  # Allow manual triggering with parameters
  workflow_dispatch:
    inputs:
      config_path:
        description: "Path to configuration directory"
        required: false
        default: "./config"
      branch:
        description: "Branch for URI validation statistics"
        required: false
        default: "dev"

jobs:
  validate-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq

      - name: Make validator scripts executable
        run: |
          chmod +x ./scripts/publication-validator.sh
          chmod +x ./scripts/validate_uris.sh

      - name: Run publication validator and save full output
        run: |
          mkdir -p $RUNNER_TEMP/validation
          ./scripts/publication-validator.sh ${{ github.event.inputs.config_path || './config' }} 2>&1 | tee $RUNNER_TEMP/validation/publication-validator-full-log.txt
          cp $RUNNER_TEMP/validation/publication-validator-full-log.txt publication-validator-full-log.txt

      - name: Run URI validator and save full output
        run: |
          mkdir -p $RUNNER_TEMP/validation
          ./scripts/validate_uris.sh ${{ github.event.inputs.branch || 'dev' }} 2>&1 | tee $RUNNER_TEMP/validation/uri-validator-full-log.txt
          cp $RUNNER_TEMP/validation/uri-validator-full-log.txt uri-validator-full-log.txt

      - name: Extract and display publication validator summary
        run: |
          echo "## Publication Validator Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -n '/======= Validation Summary =======/{:a;p;n;/^$/!ba;}' publication-validator-full-log.txt >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          sed -n '/===== DETAILED OVERVIEW OF FAILED ENDPOINTS =====/{:a;p;n;/^$/!ba;}' publication-validator-full-log.txt >> $GITHUB_STEP_SUMMARY

          # Also output to console
          echo "---"
          sed -n '/======= Validation Summary =======/{:a;p;n;/^$/!ba;}' publication-validator-full-log.txt
          sed -n '/===== DETAILED OVERVIEW OF FAILED ENDPOINTS =====/{:a;p;n;/^$/!ba;}' publication-validator-full-log.txt

      - name: Extract and display URI validator summary
        run: |
          echo "## URI Validator Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Statistics Repository URIs (Branch: ${{ github.event.inputs.branch || 'dev' }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat uri-validator-full-log.txt >> $GITHUB_STEP_SUMMARY

          # Also output to console
          echo "---"
          cat uri-validator-full-log.txt

      - name: Upload full logs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validation-full-logs
          path: |
            publication-validator-full-log.txt
            uri-validator-full-log.txt
          retention-days: 7
